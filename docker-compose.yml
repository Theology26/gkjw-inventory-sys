version: '3.8'

services:
  # 1. Database PostgreSQL 16 (Terkonfigurasi hemat RAM untuk laptop server)
  db:
    image: postgres:16-alpine
    container_name: gkjw_inventory_db
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=30
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_database_kuat
      POSTGRES_DB: gkjw_sukun_inventory
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      resources:
        limits:
          memory: 250M

  # 2. Backend API FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gkjw_inventory_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://postgres:password_database_kuat@db:5432/gkjw_sukun_inventory
      UPLOAD_DIR: /app/storage/uploads
      JWT_SECRET_KEY: gkjw_production_secret_key_change_me_in_real_deployment
    volumes:
      - uploads_data:/app/storage/uploads
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 150M

  # 3. Nginx Reverse Proxy & Static Frontend Server
  nginx:
    image: nginx:alpine
    container_name: gkjw_inventory_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - uploads_data:/storage/uploads:ro

volumes:
  pg_data:
  uploads_data:
